  <script>
    (function () {
      const list = document.getElementById("news-list-page");
      if (!list || !window.NewsStore) return;

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;");
      }

      const fallbackImage = window.NewsStore.DEFAULT_NEWS_FALLBACK;

      function renderPageNews() {
        const newsItems = window.NewsStore.listPublished();
        list.replaceChildren();

        if (!newsItems.length) {
          const empty = document.createElement("li");
          empty.className = "empty-news";
          empty.textContent = "目前沒有可顯示的消息。";
          list.appendChild(empty);
          return;
        }

        newsItems.forEach((item) => {
          const li = document.createElement("li");
          const main = document.createElement("div");
          main.className = "news-item-main";

          const img = document.createElement("img");
          img.className = "news-thumb";
          img.alt = item.title || "";
          img.loading = "lazy";
          img.decoding = "async";
          window.NewsStore.applyNewsImage(img, item.image_url, fallbackImage);

          const text = document.createElement("div");
          text.className = "news-text";
          const ext = (item.external_url || "").trim();
          const link = document.createElement("a");
          if (ext) {
            link.href = ext;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          } else {
            link.href = `news-detail.html?id=${encodeURIComponent(item.id)}`;
            link.className = "news-title-no-link";
          }
          link.textContent = item.title || "";
          text.appendChild(link);

          main.appendChild(img);
          main.appendChild(text);

          const time = document.createElement("time");
          time.dateTime = item.date || "";
          time.textContent = item.date || "";

          li.appendChild(main);
          li.appendChild(time);
          list.appendChild(li);
        });
      }

      renderPageNews();
      window.addEventListener("immba-news-updated", renderPageNews);
      window.addEventListener("storage", (e) => {
        const key = window.NewsStore?.STORAGE_KEY;
        const imagesKey = window.NewsStore?.IMAGES_KEY;
        if (e.key === key || e.key === imagesKey) renderPageNews();
      });
    })();
  </script>
