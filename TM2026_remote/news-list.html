  <script>
    (function () {
      const list = document.getElementById("news-list-page");
      if (!list || !window.NewsStore) return;

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;");
      }

      const newsItems = window.NewsStore.listPublished();
      const fallbackImage =
        "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=300&q=70";

      if (!newsItems.length) {
        list.innerHTML = '<li class="empty-news">目前沒有可顯示的消息。</li>';
        return;
      }

      list.innerHTML = newsItems
        .map((item) => {
          const safeTitle = escapeHtml(item.title || "");
          const safeDate = escapeHtml(item.date || "");
          const ext = (item.external_url || "").trim();
          const imgSrc = (item.image_url || "").trim() || fallbackImage;
          const safeImg = escapeAttr(imgSrc);
          const internalUrl = `news-detail.html?id=${encodeURIComponent(item.id)}`;
          const titleNode = ext
            ? `<a href="${escapeAttr(ext)}" target="_blank" rel="noopener noreferrer">${safeTitle}</a>`
            : `<a href="${internalUrl}" class="news-title-no-link">${safeTitle}</a>`;

          return `<li>
          <div class="news-item-main">
            <img class="news-thumb" src="${safeImg}" alt="${safeTitle}" loading="lazy" decoding="async" />
            <div class="news-text">
              ${titleNode}
            </div>
          </div>
          <time datetime="${escapeAttr(item.date || "")}">${safeDate}</time>
        </li>`;
        })
        .join("");
    })();
  </script>
