<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>賣場信箱驗證｜imMBA</title>
  <style>
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
      color: #075985;
    }
    #msg { font-size: 15px; padding: 24px; text-align: center; max-width: 420px; line-height: 1.55; }
  </style>
</head>
<body>
  <p id="msg">正在完成賣場信箱驗證，請稍候…</p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="marketplace-auth.js"></script>
  <script>
    (function () {
      function goLogin(qs) {
        location.replace("login.html" + (qs || ""));
      }
      (async function () {
        try {
          if (window.MarketplaceAuth.diagnoseSupabaseEnv()) {
            goLogin("?callback=error");
            return;
          }
          var sb = window.MarketplaceAuth.getClient();
          if (!sb) {
            goLogin("?callback=error");
            return;
          }
          for (var i = 0; i < 40; i++) {
            var r = await sb.auth.getSession();
            if (r.data && r.data.session) {
              await window.MarketplaceAuth.bootstrapFromSupabase();
              goLogin("?email_verified=1&next=/marketplace.html");
              return;
            }
            await new Promise(function (x) { setTimeout(x, 120); });
          }
          goLogin("?callback=error");
        } catch (e) {
          goLogin("?callback=error");
        }
      })();
    })();
  </script>
</body>
</html>
