<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新聞詳情 | 法國學習歷程</title>
  <style>
    :root {
      --line: #bae6fd;
      --text: #0f2d44;
      --muted: #3d6b85;
      --primary: #38bdf8;
      --primary-deep: #0ea5e9;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    body { background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%); color: var(--text); }
    .wrap { width: min(920px, calc(100% - 32px)); margin: 24px auto 40px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(80, 113, 98, 0.14);
    }
    .hero {
      min-height: 280px;
      background:
        linear-gradient(130deg, rgba(229, 240, 234, 0.68), rgba(246, 251, 248, 0.9)),
        url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1400&q=80") center/cover no-repeat;
    }
    .body { padding: 22px; }
    h1 { font-size: 30px; margin-bottom: 8px; color: #075985; }
    .date { color: var(--muted); margin-bottom: 16px; font-size: 14px; }
    p { line-height: 1.85; margin-top: 10px; color: #1e4d6b; }
    .back {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--primary-deep), var(--primary));
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <article class="card">
      <div class="hero"></div>
      <div class="body">
        <h1>【用同樣的學費，走一段法國的學習歷程】</h1>
        <div class="date">發布日期：2026/03/18</div>
        <p>本課程結合國際合作資源，提供學生在相同學費架構下參與海外學習歷程。透過跨文化課程與在地實務參訪，建立國際管理視角。</p>
        <p>學生可依規劃參與海外模組與專題學習，並與不同國籍同儕共同討論案例，在真實情境中強化跨國溝通與分析能力。</p>
        <a class="back" href="../index.html">返回首頁</a>
      </div>
    </article>
  </main>
</body>
</html>
