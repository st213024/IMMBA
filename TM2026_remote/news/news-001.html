<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新聞詳情 | Fall 2026 申請公告</title>
  <style>
    :root {
      --line: #d8e5de;
      --text: #2f3f38;
      --muted: #60756a;
      --primary: #8cae9f;
      --primary-deep: #6f9382;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    body { background: linear-gradient(180deg, #f7fbf9 0%, #eef5f1 50%, #fbfdfc 100%); color: var(--text); }
    .wrap { width: min(920px, calc(100% - 32px)); margin: 24px auto 40px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(80, 113, 98, 0.14);
    }
    .hero {
      min-height: 280px;
      background:
        linear-gradient(130deg, rgba(229, 240, 234, 0.68), rgba(246, 251, 248, 0.9)),
        url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1400&q=80") center/cover no-repeat;
    }
    .body { padding: 22px; }
    h1 { font-size: 30px; margin-bottom: 8px; color: #355046; }
    .date { color: var(--muted); margin-bottom: 16px; font-size: 14px; }
    p { line-height: 1.85; margin-top: 10px; color: #395147; }
    .back {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--primary-deep), var(--primary));
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <article class="card">
      <div class="hero"></div>
      <div class="body">
        <h1>TOP (外國學生申請入學) Fall 2026, apply NOW!! (May 1 - May 31) - the second round</h1>
        <div class="date">發布日期：2026/02/09</div>
        <p>國際學生申請入學第二階段將於 5/1 至 5/31 開放申請。歡迎有志於國際管理領域之申請者，依招生簡章完成線上資料填寫與文件上傳。</p>
        <p>請申請者提前準備學歷證明、語言能力證明與推薦資料，並留意截止時間。若有相關問題，可透過官方聯絡窗口洽詢。</p>
        <a class="back" href="../index.html">返回首頁</a>
      </div>
    </article>
  </main>
</body>
</html>
