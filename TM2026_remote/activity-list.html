    .page-wrap-2col {
      width: min(1180px, calc(100% - 32px));
      margin: 18px auto 40px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0px;
    }

    .side-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #FFFFFF;
      padding: 14px;
      box-shadow: 0 8px 20px var(--shadow);
      height: fit-content;
    }

    .side-card h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: var(--text);
    }

    .side-card ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 6px;
    }

    .side-card a {
      display: block;
      padding: 9px 10px;
      border-radius: 10px;
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .side-card a:hover {
      background: #f0f9ff;
      border-color: var(--line);
      color: var(--primary-deep);
    }

    .side-card a.is-active {
      background: #e0f2fe;
      border-color: #bae6fd;
      color: var(--primary-deep);
    }

    .content-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #FFFFFF;
      box-shadow: 0 8px 20px var(--shadow);
      overflow: hidden;
    }

    .content-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #f0f9ff;
      color: var(--text);
      font-weight: 800;
    }

    .activity-row-list {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .activity-row {
      display: grid;
      grid-template-columns: minmax(0, 332px) 1fr;
      gap: 18px;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px rgba(15, 52, 96, 0.07);
      transition:
        transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 220ms ease,
        border-color 220ms ease;
    }

    .activity-row:hover {
      transform: translateY(-6px);
      border-color: rgba(63, 106, 165, 0.4);
      box-shadow:
        0 14px 28px rgba(63, 106, 165, 0.14),
        0 28px 48px rgba(15, 52, 96, 0.1);
    }

    .activity-row:focus-visible {
      outline: 2px solid var(--accent-muted);
      outline-offset: 3px;
    }

    .activity-row-media {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #e0f2fe;
      width: 100%;
      max-width: 332px;
      aspect-ratio: 332 / 217;
      position: relative;
      align-self: start;
    }

    .activity-row-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .activity-row-body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      padding: 4px 4px 4px 0;
    }

    .activity-row .title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .activity-row .date {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-bottom: 10px;
    }

    .activity-row .excerpt {
      font-size: 15px;
      line-height: 1.75;
      color: #0369a1;
      margin: 0;
    }

    .activity-readmore {
      display: inline-flex;
      align-items: center;
      margin-top: 14px;
      padding: 9px 16px;
      border-radius: 999px;
      background: #e8f2fc;
      color: var(--primary-deep);
      border: 1px solid #c7d9f5;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
      letter-spacing: 0.02em;
      box-shadow: none;
      transition:
        background 200ms ease,
        color 200ms ease,
        border-color 200ms ease,
        box-shadow 200ms ease;
    }

    .activity-row:hover .activity-readmore {
      background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 55%, #0284c7 100%);
      color: #f0f9ff;
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow:
        0 4px 12px rgba(30, 58, 48, 0.35),
        0 2px 4px rgba(20, 40, 32, 0.25);
    }

    @media (max-width: 720px) {
      .page-wrap-2col {
        grid-template-columns: 1fr;
      }
      .activity-row {
        grid-template-columns: 1fr;
      }
      .activity-row-media {
        width: min(332px, 100%);
        margin-inline: auto;
      }
    }
  </style>
</head>

  <script>
    (function () {
      const container = document.getElementById("activity-row-list");
      const items = window.activityPages?.activities || [];
      const excerptMaxChars = 150;
      const isEn = document.documentElement.lang === "en";
      const readMoreLabel = "Read More";

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function stripNewlines(s) {
        return String(s || "").replace(/\s+/g, " ").trim();
      }

      function excerptFromText(text) {
        const t = stripNewlines(text);
        const truncated = t.length > excerptMaxChars;
        const shown = truncated ? t.slice(0, excerptMaxChars) + "..." : t;
        return { shown, truncated };
      }

      const published = items
        .filter((x) => (x.status ?? "published") === "published")
        .sort((a, b) => Number(a.sort_order) - Number(b.sort_order));

      container.innerHTML = published
        .map((item) => {
          const title = isEn
            ? item.titleEn || item.titleZh || item.title
            : item.titleZh || item.title;
          const href = isEn
            ? `activity-detail-en.html?idx=${encodeURIComponent(item.idx)}`
            : `activity-detail.html?idx=${encodeURIComponent(item.idx)}`;

          const date = isEn ? item.dateEn || item.date : item.date;
          const summaryText = isEn
            ? item.summaryEn || (Array.isArray(item.contentEn) ? item.contentEn.join(" ") : item.paragraphsEn)
            : item.summaryZh || (Array.isArray(item.contentZh) ? item.contentZh.join(" ") : item.paragraphs);
          const { shown, truncated } = excerptFromText(summaryText);
          const safeTitle = escapeHtml(title);
          const safeDate = escapeHtml(date);
          const safeShown = escapeHtml(shown);
          const imgSrc = window.ActivityStore?.getDisplayImageUrl?.(
            item.imageUrl || item.imageSrc
          ) || item.imageUrl || item.imageSrc ||
            "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=900&q=80";

          return `
            <a class="activity-row" href="${href}">
              <div class="activity-row-media">
                <img src="${escapeHtml(imgSrc)}" alt="${safeTitle}" loading="lazy" decoding="async" />
              </div>
              <div class="activity-row-body">
                <div class="title">${safeTitle}</div>
                <time class="date">${safeDate}</time>
                <p class="excerpt">${safeShown}</p>
                ${truncated ? `<span class="activity-readmore">${escapeHtml(readMoreLabel)}</span>` : ""}
              </div>
            </a>
          `;
        })
        .join("");
    })();
  </script>
