  <main class="news-detail-wrap">

        <h1 id="title" class="news-detail-title">消息內容</h1>
        <div id="date" class="news-detail-date"></div>

  <script src="news-store.js"></script>
  <script>
    const fallbackImage = "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=70";
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const item = id ? window.NewsStore.getById(id) : null;

    const titleEl = document.getElementById("title");
    const dateEl = document.getElementById("date");
    const contentEl = document.getElementById("content");
    const coverEl = document.getElementById("cover");

    if (!item) {
      titleEl.textContent = "找不到此消息";
      dateEl.textContent = "";
      contentEl.textContent = "請返回首頁重新選擇消息。";
      coverEl.src = fallbackImage;
    } else {
      titleEl.textContent = item.title || "未命名消息";
      dateEl.textContent = item.date || "";
      contentEl.textContent = item.content || "（尚無文章內容）";
      coverEl.src = item.image_url || fallbackImage;
    }
  </script>
