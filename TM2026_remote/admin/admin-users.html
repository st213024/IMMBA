<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理員權限管理｜imMBA</title>
  <link rel="stylesheet" href="admin-shell.css" />
  <style>
    .admin-main__inner {
      max-width: 1280px;
      margin: 0 auto;
    }
    .um-panel {
      background: #fff;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }
    .um-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px 16px;
      border-bottom: 1px solid #e8ecf2;
      flex-wrap: wrap;
    }
    .um-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .um-meta {
      font-size: 14px;
      color: #475569;
      text-align: right;
    }
    .um-meta strong {
      color: #0f172a;
      font-weight: 700;
    }
    .um-meta-sep {
      margin: 0 6px;
      color: #94a3b8;
      font-weight: 400;
    }
    .um-badge-warn {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: #fef3c7;
      color: #92400e;
      vertical-align: middle;
    }
    .um-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      background: #fafbfc;
      border-bottom: 1px solid #e8ecf2;
      flex-wrap: wrap;
    }
    .um-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      color: #475569;
      flex-shrink: 0;
    }
    .um-icon-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .um-search {
      flex: 1;
      min-width: 180px;
      max-width: 420px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
    .um-search:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }
    .um-search input {
      flex: 1;
      border: 0;
      outline: 0;
      font-size: 14px;
      font-family: inherit;
      min-width: 0;
    }
    .um-search input::placeholder {
      color: #94a3b8;
    }
    .um-btn {
      height: 38px;
      padding: 0 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      flex-shrink: 0;
    }
    .um-btn--primary {
      background: #2563eb;
      color: #fff;
      border-color: #1d4ed8;
    }
    .um-btn--primary:hover {
      background: #1d4ed8;
    }
    .um-btn-save {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #f0f9ff;
      border-color: #1a3329;
    }
    .um-btn-save:hover:not(:disabled) {
      filter: brightness(1.05);
    }
    .um-btn-save:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .um-banner {
      display: none;
      margin: 0 22px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    .um-banner.is-ok {
      display: block;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
    }
    .um-banner.is-err {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .um-table-wrap {
      overflow-x: auto;
    }
    .um-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .um-table th {
      text-align: left;
      padding: 12px 16px;
      font-weight: 600;
      color: #334155;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    .um-table th.um-serial-th,
    .um-table td.um-serial {
      width: 56px;
      text-align: center;
      color: #64748b;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .um-table th.um-serial-th {
      color: #334155;
    }
    .um-table td {
      padding: 14px 16px;
      border-bottom: 1px solid #eef2f7;
      color: #1e293b;
      vertical-align: middle;
    }
    .um-table tbody tr:hover {
      background: #fafbfc;
    }
    .um-table tbody tr:last-child td {
      border-bottom: 0;
    }
    .um-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      word-break: break-all;
    }
    .um-link:hover {
      text-decoration: underline;
    }
    .um-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .um-badge--proj {
      background: #ccfbf1;
      color: #0f766e;
    }
    .um-badge--src {
      background: #e0f2fe;
      color: #0369a1;
    }
    .um-muted {
      color: #94a3b8;
    }
    .um-select {
      min-width: 148px;
      max-width: 220px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: #1e293b;
    }
    .um-select:disabled {
      background: #f1f5f9;
      color: #475569;
    }
    .um-readonly-role {
      font-weight: 600;
      color: #0f172a;
    }
    .um-role-cell {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .um-act-del-inline {
      font-size: 13px;
      border: 0;
      background: none;
      color: #b91c1c;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px 0;
      font-family: inherit;
    }
    .um-act-del-inline:hover {
      color: #991b1b;
    }
    .um-act-del-inline:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .um-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 22px 16px;
      border-top: 1px solid #e8ecf2;
      background: #fafbfc;
      flex-wrap: wrap;
    }
    .um-back {
      font-size: 14px;
      color: #475569;
      text-decoration: none;
    }
    .um-back:hover {
      color: #2563eb;
    }
    .um-pagination {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }
    .um-page-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .um-page-nav button {
      width: 32px;
      height: 32px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      color: #475569;
    }
    .um-page-nav button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .um-page-nav span {
      min-width: 28px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
    }
    .um-page-size {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748b;
    }
    .um-page-size select {
      height: 32px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
    }
    .um-empty td {
      text-align: center;
      color: #64748b;
      padding: 40px 16px;
    }
    .shell-hide { display: none !important; }
    .um-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 22px 0;
      border-bottom: 1px solid #e8ecf2;
      background: #fafbfc;
    }
    .um-tab {
      border: 0;
      border-radius: 8px 8px 0 0;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      color: #64748b;
      font-family: inherit;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .um-tab--active {
      color: #0f172a;
      background: #fff;
      border-color: #e8ecf2;
      border-bottom-color: #fff;
    }
  </style>
</head>
<body data-admin-page="admin-users">
  <div class="admin-app shell-hide" id="admin-root">
    <aside class="admin-sidebar" id="admin-sidebar-mount"></aside>
    <div class="admin-main">
      <div class="admin-main__inner">
        <div class="um-panel">
          <header class="um-head">
            <h1 class="um-title">管理員權限管理</h1>
            <div class="um-meta">
              <span id="um-meta-admin">全部 <strong id="um-total-count">0</strong> 筆<span class="um-meta-sep">·</span>待審核
              <strong id="um-pending-count">0</strong></span>
              <span id="um-meta-marketplace" hidden>賣場會員 <strong id="um-mp-total-count">0</strong> 筆</span>
            </div>
          </header>
          <div class="um-tabs" role="tablist">
            <button type="button" class="um-tab um-tab--active" id="um-tab-admin" role="tab">後台管理者</button>
            <button type="button" class="um-tab" id="um-tab-marketplace" role="tab">賣場會員</button>
          </div>
          <div class="um-toolbar">
            <button type="button" class="um-icon-btn" id="um-filter-btn" title="篩選（聚焦搜尋）" aria-label="篩選">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 4h16M7 12h10M10 20h4" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="um-search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4" stroke-linecap="round"/>
              </svg>
              <input type="search" id="um-q" placeholder="搜尋 Email" autocomplete="off" />
            </div>
            <button type="button" class="um-btn um-btn-save" id="um-save" disabled>儲存變更</button>
            <button type="button" class="um-btn um-btn--primary" id="um-refresh">重新整理</button>
          </div>
          <div id="um-banner" class="um-banner" role="status"></div>
          <div class="um-table-wrap" id="um-table-wrap">
            <p style="margin:0;padding:24px 22px;color:#64748b;">讀取中…</p>
          </div>
          <footer class="um-footer">
            <a class="um-back" href="dashboard.html">← 回首頁</a>
            <div class="um-pagination">
              <div class="um-page-nav">
                <button type="button" id="um-prev" aria-label="上一頁">&lt;</button>
                <span id="um-page-num">1</span>
                <button type="button" id="um-next" aria-label="下一頁">&gt;</button>
              </div>
              <label class="um-page-size">
                <select id="um-page-size" aria-label="每頁筆數">
                  <option value="10">10 / page</option>
                  <option value="20">20 / page</option>
                  <option value="50">50 / page</option>
                </select>
              </label>
            </div>
          </footer>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=5"></script>
  <script src="supabase-auth.js?v=9"></script>
  <script src="require-auth.js?v=5"></script>
  <script src="admin-sidebar.js?v=7"></script>
  <script>
    (function () {
      var LOCKED_EMAIL = "st213024@gmail.com";
      var activeTab = "admin";
      var allRows = [];
      var mpRows = [];
      var mpLoadError = "";
      var mpPendingEdits = {};
      var pendingEdits = {};
      var page = 1;
      var pageSize = 10;
      var q = "";

      function normEmail(em) {
        return String(em || "").trim().toLowerCase();
      }
      function isLockedRow(em) {
        return normEmail(em) === LOCKED_EMAIL;
      }
      function rowIsPendingReview(r) {
        if (!r || r.is_active === false) return false;
        if (r.role === "super_admin") return false;
        var hasReview =
          Object.prototype.hasOwnProperty.call(r, "status") ||
          Object.prototype.hasOwnProperty.call(r, "approved");
        if (hasReview) {
          if (r.status === "rejected" || r.status === "disabled") return false;
          if (r.status === "approved" && r.approved === true) return false;
          return r.approved === false || r.status === "pending";
        }
        return r.role === "viewer" && r.user_id != null;
      }
      function isPending(r) {
        var A = window.AdminAuth;
        if (A && typeof A.isPendingManagementReview === "function") {
          return A.isPendingManagementReview(r);
        }
        return rowIsPendingReview(r);
      }
      function initialRoleSelect(r) {
        var role = r.role || "viewer";
        if (role === "super_admin") return "admin";
        if (role === "admin") return "admin";
        return "viewer";
      }
      function snapshotFromRow(r) {
        if (isLockedRow(r.email)) return null;
        return { role: initialRoleSelect(r), is_active: !!r.is_active };
      }
      function findRowByEmail(emailKey) {
        var k = normEmail(emailKey);
        for (var i = 0; i < allRows.length; i++) {
          if (normEmail(allRows[i].email) === k) return allRows[i];
        }
        return null;
      }
      function syncSaveBtn() {
        var has =
          activeTab === "admin"
            ? Object.keys(pendingEdits).length > 0
            : Object.keys(mpPendingEdits).length > 0;
        document.getElementById("um-save").disabled = !has;
      }
      function onDraftChange(rowEmail) {
        var k = normEmail(rowEmail);
        var r = findRowByEmail(k);
        if (!r || isLockedRow(r.email)) {
          delete pendingEdits[k];
          syncSaveBtn();
          return;
        }
        var wrap = document.getElementById("um-table-wrap");
        var tr = null;
        wrap.querySelectorAll("tr[data-row-email]").forEach(function (node) {
          if (node.getAttribute("data-row-email") === k) tr = node;
        });
        if (!tr) {
          syncSaveBtn();
          return;
        }
        var roleSel = tr.querySelector(".um-sel-role");
        var actSel = tr.querySelector(".um-sel-active");
        if (!roleSel || !actSel) {
          syncSaveBtn();
          return;
        }
        var role = roleSel.value;
        var isActive = actSel.value === "1";
        var snap = snapshotFromRow(r);
        if (role === snap.role && isActive === snap.is_active) {
          delete pendingEdits[k];
        } else {
          pendingEdits[k] = { role: role, is_active: isActive };
        }
        syncSaveBtn();
      }

      /** 超級管理員置頂；固定超級管理員列於超級群組最前；其餘依更新時間新到舊 */
      function sortRowsForDisplay(rows) {
        return rows.slice().sort(function (a, b) {
          var ra = a.role || "";
          var rb = b.role || "";
          var aSuper = ra === "super_admin" ? 1 : 0;
          var bSuper = rb === "super_admin" ? 1 : 0;
          if (aSuper !== bSuper) return bSuper - aSuper;
          if (aSuper && bSuper) {
            var al = isLockedRow(a.email) ? 1 : 0;
            var bl = isLockedRow(b.email) ? 1 : 0;
            if (al !== bl) return bl - al;
          }
          var ta = new Date(a.updated_at || a.created_at || 0).getTime();
          var tb = new Date(b.updated_at || b.created_at || 0).getTime();
          return tb - ta;
        });
      }

      async function fetchAllMembers() {
        var A = window.AdminAuth;
        if (!A) throw new Error("AdminAuth 未載入，請強制重新整理（Ctrl+F5）。");
        if (typeof A.listAdminUsers !== "function") {
          throw new Error("supabase-auth.js 版本過舊，請強制重新整理。");
        }
        var rows = await A.listAdminUsers();
        return sortRowsForDisplay(rows);
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }
      function setBanner(msg, ok) {
        var b = document.getElementById("um-banner");
        if (!msg) {
          b.className = "um-banner";
          b.textContent = "";
          return;
        }
        b.textContent = msg;
        b.className = "um-banner " + (ok ? "is-ok" : "is-err");
      }
      function filtered() {
        var needle = q.trim().toLowerCase();
        var list = !needle
          ? allRows.slice()
          : allRows.filter(function (r) {
              return String(r.email || "").toLowerCase().indexOf(needle) !== -1;
            });
        return sortRowsForDisplay(list);
      }
      function totalPages(n) {
        return Math.max(1, Math.ceil(n / pageSize));
      }
      function slicePage(arr) {
        var tp = totalPages(arr.length);
        if (page > tp) page = tp;
        var start = (page - 1) * pageSize;
        return arr.slice(start, start + pageSize);
      }

      function effectiveDraft(r) {
        if (isLockedRow(r.email)) return null;
        var k = normEmail(r.email);
        if (pendingEdits[k]) return pendingEdits[k];
        return snapshotFromRow(r);
      }

      function renderMarketplace() {
        var needle = q.trim().toLowerCase();
        var arr = !needle
          ? mpRows.slice()
          : mpRows.filter(function (r) {
              return String(r.email || "").toLowerCase().indexOf(needle) !== -1;
            });
        document.getElementById("um-mp-total-count").textContent = String(mpRows.length);
        var tp = totalPages(arr.length);
        document.getElementById("um-page-num").textContent = String(page);
        document.getElementById("um-prev").disabled = page <= 1;
        document.getElementById("um-next").disabled = page >= tp;
        var slice = slicePage(arr);
        var wrap = document.getElementById("um-table-wrap");
        if (!slice.length) {
          var emptyMsg = mpRows.length
            ? "無符合搜尋結果。"
            : mpLoadError ||
              "尚無賣場會員。若會員已在賣場註冊但仍空白，請在 Supabase SQL Editor 執行 marketplace-members-schema.sql 與 supabase-marketplace-isolation-v1.sql 後按「重新整理」。";
          wrap.innerHTML =
            '<table class="um-table"><tbody><tr class="um-empty"><td colspan="6">' +
            esc(emptyMsg) +
            "</td></tr></tbody></table>";
          return;
        }
        var html =
          '<table class="um-table"><thead><tr>' +
          "<th>Email</th><th>顯示名稱</th><th>狀態</th><th>可賣商品</th><th>註冊時間</th><th>操作</th>" +
          "</tr></thead><tbody>";
        slice.forEach(function (r) {
          var k = normEmail(r.email);
          var draft = mpPendingEdits[k] || {
            status: r.status || "active",
            seller_enabled: r.seller_enabled !== false
          };
          html +=
            '<tr data-mp-email="' + esc(k) + '">' +
            "<td>" + esc(r.email) + "</td>" +
            "<td>" + esc(r.display_name || "—") + "</td>" +
            '<td><select class="um-sel-mp-status" data-mp-email="' + esc(k) + '">' +
            '<option value="active"' + (draft.status === "active" ? " selected" : "") + ">啟用</option>" +
            '<option value="suspended"' + (draft.status === "suspended" ? " selected" : "") + ">停權</option>" +
            "</select></td>" +
            '<td><select class="um-sel-mp-seller" data-mp-email="' + esc(k) + '">' +
            '<option value="1"' + (draft.seller_enabled ? " selected" : "") + ">是</option>" +
            '<option value="0"' + (!draft.seller_enabled ? " selected" : "") + ">否</option>" +
            "</select></td>" +
            "<td>" + esc((r.created_at || "").slice(0, 10) || "—") + "</td>" +
            "<td>—</td></tr>";
        });
        html += "</tbody></table>";
        wrap.innerHTML = html;
      }

      function onMpDraftChange(emailKey) {
        var k = normEmail(emailKey);
        var r = mpRows.find(function (x) { return normEmail(x.email) === k; });
        if (!r) {
          delete mpPendingEdits[k];
          syncSaveBtn();
          return;
        }
        var tr = document.querySelector('tr[data-mp-email="' + k.replace(/"/g, "\\\"") + '"]');
        if (!tr) return;
        var stSel = tr.querySelector(".um-sel-mp-status");
        var sellerSel = tr.querySelector(".um-sel-mp-seller");
        if (!stSel || !sellerSel) return;
        var status = stSel.value;
        var sellerEnabled = sellerSel.value === "1";
        if (status === (r.status || "active") && sellerEnabled === (r.seller_enabled !== false)) {
          delete mpPendingEdits[k];
        } else {
          mpPendingEdits[k] = { status: status, seller_enabled: sellerEnabled };
        }
        syncSaveBtn();
      }

      async function fetchMarketplaceMembers() {
        var A = window.AdminAuth;
        if (!A || typeof A.listMarketplaceMembers !== "function") {
          throw new Error("請強制重新整理以載入 supabase-auth.js?v=6。");
        }
        return await A.listMarketplaceMembers();
      }

      async function loadMarketplaceOnly() {
        try {
          mpRows = await fetchMarketplaceMembers();
          mpLoadError = "";
        } catch (mpErr) {
          mpRows = [];
          mpLoadError = (mpErr && mpErr.message) || String(mpErr);
          setBanner(mpLoadError, false);
        }
        Object.keys(mpPendingEdits).forEach(function (key) {
          if (!mpRows.find(function (r) { return normEmail(r.email) === key; })) delete mpPendingEdits[key];
        });
        if (activeTab === "marketplace") renderMarketplace();
      }

      function setActiveTab(tab) {
        activeTab = tab === "marketplace" ? "marketplace" : "admin";
        document.getElementById("um-tab-admin").classList.toggle("um-tab--active", activeTab === "admin");
        document.getElementById("um-tab-marketplace").classList.toggle("um-tab--active", activeTab === "marketplace");
        document.getElementById("um-meta-admin").hidden = activeTab !== "admin";
        document.getElementById("um-meta-marketplace").hidden = activeTab !== "marketplace";
        page = 1;
        q = "";
        document.getElementById("um-q").value = "";
        document.getElementById("um-q").placeholder = activeTab === "admin" ? "搜尋 Email" : "搜尋賣場會員 Email";
        syncSaveBtn();
        if (activeTab === "admin") {
          render();
        } else {
          loadMarketplaceOnly();
        }
      }

      function render() {
        if (activeTab === "marketplace") {
          renderMarketplace();
          return;
        }
        var arr = filtered();
        var pendN = 0;
        for (var pi = 0; pi < allRows.length; pi++) {
          if (isPending(allRows[pi])) pendN++;
        }
        document.getElementById("um-total-count").textContent = String(allRows.length);
        document.getElementById("um-pending-count").textContent = String(pendN);
        var tp = totalPages(arr.length);
        document.getElementById("um-page-num").textContent = String(page);
        document.getElementById("um-prev").disabled = page <= 1;
        document.getElementById("um-next").disabled = page >= tp;

        var wrap = document.getElementById("um-table-wrap");
        if (!arr.length) {
          wrap.innerHTML =
            '<table class="um-table"><tbody><tr class="um-empty"><td colspan="10">' +
            (allRows.length ? "沒有符合搜尋的帳號。" : "尚無任何會員列於權限表。") +
            "</td></tr></tbody></table>";
          return;
        }

        var me = window.AdminAuth.getLocalSession();
        var meEm = me ? normEmail(me.email) : "";

        var rows = slicePage(arr);
        var baseIdx = (page - 1) * pageSize;
        var html =
          '<table class="um-table"><thead><tr>' +
          '<th class="um-serial-th">序號</th>' +
          "<th>帳號</th><th>Email</th><th>帳戶角色</th><th>專案</th><th>登入來源</th><th>MFA</th><th>狀態</th><th>操作</th>" +
          "</tr></thead><tbody>";
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          var em = r.email || "";
          var k = normEmail(em);
          var emEsc = esc(em);
          var mailHref = "mailto:" + encodeURIComponent(em);
          var locked = isLockedRow(em);
          var pend = isPending(r);
          var draft = effectiveDraft(r);
          var selRole = locked ? "admin" : draft.role;
          var selActive = locked ? true : draft.is_active;
          var serial = baseIdx + i + 1;

          html += '<tr data-row-email="' + esc(k) + '">';
          html += '<td class="um-serial">' + serial + "</td>";
          html +=
            '<td><a class="um-link" href="' +
            esc(mailHref) +
            '">' +
            emEsc +
            "</a></td>";
          html += "<td>" + emEsc + "</td>";

          if (locked) {
            html +=
              '<td><div class="um-role-cell"><span class="um-readonly-role">超級管理員</span><span class="um-muted">（固定）</span>' +
              (pend ? '<span class="um-badge-warn">待審核</span>' : "") +
              "</div></td>";
          } else {
            html += '<td><div class="um-role-cell">';
            html +=
              '<select class="um-select um-sel-role" aria-label="帳戶角色">' +
              '<option value="viewer"' +
              (selRole === "viewer" ? " selected" : "") +
              ">僅檢視</option>" +
              '<option value="admin"' +
              (selRole === "admin" ? " selected" : "") +
              ">一般管理者</option>" +
              "</select>";
            if (pend) html += '<span class="um-badge-warn">待審核</span>';
            html += "</div></td>";
          }

          html += '<td><span class="um-badge um-badge--proj">imMBA</span></td>';
          html += '<td><span class="um-badge um-badge--src">Supabase</span></td>';
          html += '<td class="um-muted">—</td>';

          if (locked) {
            html += '<td><span class="um-readonly-role">啟用</span></td>';
          } else {
            html +=
              '<td><select class="um-select um-sel-active" aria-label="狀態">' +
              '<option value="1"' +
              (selActive ? " selected" : "") +
              ">啟用</option>" +
              '<option value="0"' +
              (!selActive ? " selected" : "") +
              ">停用</option>" +
              "</select></td>";
          }

          html += "<td>";
          if (!locked && meEm !== k) {
            html +=
              '<button type="button" class="um-act-del-inline" data-row-email="' +
              emEsc +
              '">刪除</button>';
          } else {
            html += '<span class="um-muted">—</span>';
          }
          html += "</td></tr>";
        }
        html += "</tbody></table>";
        wrap.innerHTML = html;
      }

      async function loadAll(clearDraft) {
        var hasDraft = Object.keys(pendingEdits).length || Object.keys(mpPendingEdits).length;
        if (clearDraft !== false && hasDraft) {
          if (!confirm("有未儲存的變更，確定要重新載入並捨棄？")) return;
        }
        if (clearDraft !== false) {
          pendingEdits = {};
          mpPendingEdits = {};
        }
        syncSaveBtn();
        var wrap = document.getElementById("um-table-wrap");
        wrap.innerHTML = '<p style="margin:0;padding:24px 22px;color:#64748b;">讀取中…</p>';
        try {
          allRows = await fetchAllMembers();
          Object.keys(pendingEdits).forEach(function (key) {
            if (!findRowByEmail(key)) delete pendingEdits[key];
          });
          try {
            mpRows = await fetchMarketplaceMembers();
            mpLoadError = "";
          } catch (mpErr) {
            mpRows = [];
            mpLoadError = (mpErr && mpErr.message) || String(mpErr);
            if (activeTab === "marketplace") setBanner(mpLoadError, false);
          }
          Object.keys(mpPendingEdits).forEach(function (key) {
            if (!mpRows.find(function (r) { return normEmail(r.email) === key; })) delete mpPendingEdits[key];
          });
          page = 1;
          render();
        } catch (e) {
          wrap.innerHTML =
            '<table class="um-table"><tbody><tr class="um-empty"><td colspan="10">' +
            esc((e && e.message) || String(e)) +
            "</td></tr></tbody></table>";
        }
      }

      async function saveChanges() {
        var A = window.AdminAuth;
        if (activeTab === "marketplace") {
          var mpKeys = Object.keys(mpPendingEdits);
          if (!mpKeys.length) return;
          if (typeof A.saveMarketplaceMemberRow !== "function") {
            setBanner("請重新整理以載入 supabase-auth.js?v=6。", false);
            return;
          }
          try {
            for (var j = 0; j < mpKeys.length; j++) {
              var mk = mpKeys[j];
              var mpe = mpPendingEdits[mk];
              await A.saveMarketplaceMemberRow(mk, mpe.status, mpe.seller_enabled);
            }
            mpPendingEdits = {};
            syncSaveBtn();
            setBanner("賣場會員設定已儲存。", true);
            await loadAll(false);
          } catch (e) {
            setBanner((e && e.message) || "儲存失敗", false);
          }
          return;
        }
        var keys = Object.keys(pendingEdits);
        if (!keys.length) return;
        if (typeof A.saveAdminRow !== "function") {
          setBanner("請重新整理以載入最新 supabase-auth.js（需含 saveAdminRow）。", false);
          return;
        }
        try {
          for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            var pe = pendingEdits[k];
            await A.saveAdminRow(k, pe.role, pe.is_active);
          }
          pendingEdits = {};
          syncSaveBtn();
          setBanner("已儲存變更。", true);
          await loadAll(false);
        } catch (e) {
          setBanner((e && e.message) || "儲存失敗", false);
        }
      }

      document.getElementById("um-tab-admin").addEventListener("click", function () {
        setBanner("", false);
        setActiveTab("admin");
      });
      document.getElementById("um-tab-marketplace").addEventListener("click", function () {
        setBanner("", false);
        setActiveTab("marketplace");
      });

      document.getElementById("um-filter-btn").addEventListener("click", function () {
        document.getElementById("um-q").focus();
      });
      document.getElementById("um-q").addEventListener("input", function () {
        q = this.value;
        page = 1;
        render();
      });
      document.getElementById("um-refresh").addEventListener("click", function () {
        setBanner("", false);
        loadAll(true);
      });
      document.getElementById("um-save").addEventListener("click", function () {
        setBanner("", false);
        saveChanges();
      });
      document.getElementById("um-prev").addEventListener("click", function () {
        if (page > 1) {
          page--;
          render();
        }
      });
      document.getElementById("um-next").addEventListener("click", function () {
        var arr = filtered();
        if (page < totalPages(arr.length)) {
          page++;
          render();
        }
      });
      document.getElementById("um-page-size").addEventListener("change", function () {
        pageSize = parseInt(this.value, 10) || 10;
        page = 1;
        render();
      });

      var tableWrap = document.getElementById("um-table-wrap");
      tableWrap.addEventListener("change", function (ev) {
        var t = ev.target;
        if (t.classList.contains("um-sel-mp-status") || t.classList.contains("um-sel-mp-seller")) {
          var mtr = t.closest("tr[data-mp-email]");
          if (mtr) onMpDraftChange(mtr.getAttribute("data-mp-email"));
          return;
        }
        if (!t.classList.contains("um-sel-role") && !t.classList.contains("um-sel-active")) return;
        var tr = t.closest("tr[data-row-email]");
        if (!tr) return;
        onDraftChange(tr.getAttribute("data-row-email"));
      });
      tableWrap.addEventListener("click", function (ev) {
        var btn = ev.target.closest(".um-act-del-inline");
        if (!btn) return;
        var raw = btn.getAttribute("data-row-email");
        if (!raw) return;
        if (!confirm("確定從管理者表刪除此帳號？")) return;
        (async function () {
          try {
            await window.AdminAuth.removeAdminUser(raw);
            delete pendingEdits[normEmail(raw)];
            syncSaveBtn();
            setBanner("已刪除。", true);
            await loadAll(false);
          } catch (e) {
            setBanner((e && e.message) || "刪除失敗", false);
          }
        })();
      });

      (async function () {
        var ok = await AdminRequireAuth.ensureSession({ requireSuperAdmin: true });
        if (!ok) return;
        document.getElementById("admin-root").classList.remove("shell-hide");
        await loadAll(false);
        try {
          var tab = new URLSearchParams(window.location.search).get("tab");
          if (tab === "marketplace") setActiveTab("marketplace");
        } catch (_) {}
      })();
    })();
  </script>
</body>
</html>
