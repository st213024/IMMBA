<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>最新公告管理｜imMBA 後台</title>
  <link rel="stylesheet" href="../admin-shell.css" />
  <style>
    :root {
      --line: #bae6fd;
      --text: #1a2332;
      --muted: #5a6575;
      --primary-deep: #075985;
      --primary: #0ea5e9;
      --panel: #ffffff;
      --danger: #b65e5e;
      --surface: #f0f9ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    body { margin: 0; background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%); color: var(--text); }
    .admin-main__inner { max-width: 1080px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(15, 52, 96, 0.12);
      padding: 18px;
      margin-bottom: 14px;
    }
    h1 { font-size: 26px; color: var(--primary-deep); margin-bottom: 10px; }
    h2 { font-size: 20px; color: #0369a1; margin-bottom: 10px; }
    .hint { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    label { font-size: 14px; color: #3d4f63; }
    input[type="text"], input[type="password"], input[type="number"], input[type="date"], textarea, select {
      border: 1px solid #b8c4d6;
      border-radius: 10px;
      padding: 10px;
      background: #fafbfe;
      color: var(--text);
    }
    input[readonly] {
      background: #eef2f7;
      color: #5a6575;
      cursor: default;
    }
    textarea { min-height: 140px; resize: vertical; }
    .inline { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, var(--primary-deep), var(--primary));
      color: #fff;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn.secondary { background: var(--surface); color: #075985; border: 1px solid var(--line); }
    .btn.danger { background: var(--danger); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border-top: 1px solid #dde3ec; padding: 10px 6px; text-align: left; vertical-align: top; font-size: 14px; }
    th { color: #3d5266; font-weight: 700; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .thumb {
      width: 72px;
      height: 52px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .preview-wrap { margin-top: 6px; }
    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--surface);
      color: #0369a1;
      font-size: 13px;
      font-weight: 700;
    }
    .notice {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #e8f2fc;
      color: #0369a1;
      font-size: 14px;
      border: 1px solid #b8d4f0;
    }
    .hide { display: none; }
    .top-actions { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .switch-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
    }
    button[disabled]{opacity:.65;cursor:not-allowed;}
    .shell-hide{display:none !important;}
    @media (max-width: 760px) {
      .row { grid-template-columns: 1fr; }
      table { font-size: 13px; }
    }
  </style>
</head>
<body data-admin-page="news">
  <div class="admin-app shell-hide" id="news-admin-root">
    <aside class="admin-sidebar" id="admin-sidebar-mount"></aside>
    <div class="admin-main">
      <div class="admin-main__inner">
  <main id="news-admin-main">
    <section class="card" id="admin-card">
      <div class="top-actions">
        <h1>最新公告管理</h1>
        <div class="actions">
          <button class="btn secondary" id="reset-form" type="button">清除表單</button>
        </div>
      </div>

      <h2>新增 / 編輯消息</h2>
      <div class="row">
        <div class="field">
          <label for="news-id">消息編號</label>
          <input id="news-id" type="text" readonly placeholder="新增時自動產生" aria-readonly="true" />
          <span class="hint" style="margin:0;">新增消息時由系統自動產生序號（格式 n-數字）；編輯既有消息時編號不可變更。</span>
        </div>
        <div class="field">
          <label for="news-date">發布日期</label>
          <input id="news-date" type="date" />
        </div>
      </div>
      <div class="field">
        <label for="news-title">消息標題</label>
        <input id="news-title" type="text" placeholder="請輸入消息標題" />
      </div>
      <div class="field">
        <label for="news-content">文章內容</label>
        <textarea id="news-content" placeholder="請輸入完整文章內容"></textarea>
      </div>
      <div class="field">
        <label for="news-url">外部連結</label>
        <input id="news-url" type="text" placeholder="https://www.management.fju.edu.tw/subweb/immba/news-detail.php?NID=xxxx" />
      </div>
      <div class="row">
        <div class="field">
          <label>排序方式</label>
          <label class="inline" style="margin-top:6px;">
            <input id="news-pinned" name="news-pinned" type="checkbox" value="1" />
            置頂顯示
          </label>
          <span class="hint" style="margin:0;">勾選「置頂」的文章會排在前台最前面；之後若有另一篇也置頂，較早置頂的會自動往後移。未勾選則為非置頂，依發布日期排序。</span>
        </div>
        <div class="field">
          <label>文章狀態</label>
          <div class="inline">
            <span class="status-badge" id="status-badge">草稿</span>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="news-image">消息圖片</label>
        <input id="news-image" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
        <div class="preview-wrap">
          <img id="news-image-preview" class="thumb" alt="消息圖片預覽" />
        </div>
      </div>
      <div class="actions">
        <button class="btn secondary" id="save-draft-btn" type="button">儲存草稿</button>
        <button class="btn" id="publish-btn" type="button">發布文章</button>
      </div>
      <p class="hint" style="margin-top:10px; line-height:1.65;">
        儲存草稿：寫入列表為草稿，下次登入可繼續編輯，前台最新公告<strong>不會</strong>顯示。<br />
        發布文章：通過必填檢查後會標示為已發布，與前台首頁／公告列表同步。
      </p>
      <div id="form-notice" class="notice hide"></div>
    </section>

    <section class="card" id="list-card">
      <h2>消息列表</h2>
      <table>
        <thead>
          <tr>
            <th>標題</th>
            <th>日期</th>
            <th>圖片</th>
            <th>狀態</th>
            <th>外部連結</th>
            <th>置頂</th>
            <th>排序</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="news-tbody"></tbody>
      </table>
    </section>
  </main>
      </div>
    </div>
  </div>

  <script src="../../news-store.js?v=20260609-img3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-auth.js"></script>
  <script src="../require-auth.js"></script>
  <script src="../admin-sidebar.js?v=7"></script>
  <script src="../admin-readonly.js?v=3"></script>
  <script>
    const tbody = document.getElementById("news-tbody");
    function getFallbackImage() {
      return (
        window.NewsStore?.DEFAULT_NEWS_FALLBACK ||
        "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=300&q=70"
      );
    }

    const inputs = {
      id: document.getElementById("news-id"),
      title: document.getElementById("news-title"),
      content: document.getElementById("news-content"),
      date: document.getElementById("news-date"),
      external_url: document.getElementById("news-url"),
      pinnedCheckbox: document.getElementById("news-pinned"),
      storedImageRef: "",
      pendingImageData: "",
      image_name: "",
      file: document.getElementById("news-image"),
      preview: document.getElementById("news-image-preview")
    };
    const statusBadge = document.getElementById("status-badge");
    const noticeEl = document.getElementById("form-notice");
    let formMode = "new";

    function showNotice(text) {
      noticeEl.textContent = text;
      noticeEl.classList.remove("hide");
      setTimeout(() => noticeEl.classList.add("hide"), 2000);
    }

    function setStatusLabel(status) {
      statusBadge.textContent = status === "published" ? "已發布" : "草稿";
    }

    function applyThumbImage(img, imageUrl) {
      if (window.NewsStore?.applyNewsImage) {
        window.NewsStore.applyNewsImage(img, imageUrl, getFallbackImage());
      } else {
        img.src = getFallbackImage();
      }
    }

    function assignNewNewsId() {
      const nextId = window.NewsStore?.allocateNewsId?.() || `n-${Date.now()}`;
      inputs.id.value = nextId;
      return nextId;
    }

    function ensureNewsId() {
      const current = inputs.id.value.trim();
      if (formMode === "edit" && current) return current;
      if (current) return current;
      return assignNewNewsId();
    }

    function updatePreview() {
      const raw = inputs.pendingImageData || inputs.storedImageRef || "";
      applyThumbImage(inputs.preview, raw);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("讀取圖片失敗。"));
        reader.readAsDataURL(file);
      });
    }

    async function compressDataUrl(dataUrl, mimeType) {
      const img = await new Promise((resolve, reject) => {
        const el = new Image();
        el.onload = () => resolve(el);
        el.onerror = () => reject(new Error("無法解析圖片，請改用 JPG 或 PNG。"));
        el.src = dataUrl;
      });
      const maxSide = 720;
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      const scale = Math.min(1, maxSide / Math.max(w, h, 1));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("無法處理圖片。");
      ctx.drawImage(img, 0, 0, w, h);
      let quality = 0.82;
      let result = canvas.toDataURL("image/jpeg", quality);
      while (result.length > 280000 && quality > 0.4) {
        quality -= 0.08;
        result = canvas.toDataURL("image/jpeg", quality);
      }
      if (result.length > 520000) {
        throw new Error("圖片壓縮後仍過大，請改用較小或較低解析度的照片。");
      }
      return result;
    }

    function isAllowedImageFile(file) {
      if (!file) return false;
      const allow = ["image/jpeg", "image/png", "image/webp", "image/pjpeg"];
      if (allow.includes(file.type)) return true;
      const name = String(file.name || "").toLowerCase();
      return /\.(jpe?g|png|webp)$/i.test(name);
    }

    async function processImageFile(file) {
      if (!file) return "";
      if (file.size > 8 * 1024 * 1024) throw new Error("圖片超過 8MB，請先縮小後再上傳。");
      const dataUrl = await readFileAsDataUrl(file);
      return compressDataUrl(dataUrl, file.type);
    }

    function clearForm() {
      formMode = "new";
      assignNewNewsId();
      inputs.title.value = "";
      inputs.date.value = "";
      inputs.content.value = "";
      inputs.external_url.value = "";
      if (inputs.pinnedCheckbox) inputs.pinnedCheckbox.checked = false;
      inputs.storedImageRef = "";
      inputs.pendingImageData = "";
      inputs.image_name = "";
      inputs.file.value = "";
      setStatusLabel("draft");
      updatePreview();
    }

    function fillForm(item) {
      formMode = "edit";
      inputs.id.value = item.id;
      inputs.title.value = item.title;
      inputs.date.value = item.date;
      inputs.content.value = item.content || "";
      inputs.external_url.value = item.external_url;
      if (inputs.pinnedCheckbox) inputs.pinnedCheckbox.checked = Boolean(item.pinned);
      inputs.storedImageRef = item.image_url || "";
      inputs.pendingImageData = "";
      inputs.image_name = item.image_name || "";
      inputs.file.value = "";
      setStatusLabel(item.status || "draft");
      updatePreview();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderTable() {
      const rows = window.NewsStore.listAll();
      tbody.replaceChildren();

      rows.forEach((item) => {
        const tr = document.createElement("tr");

        const titleTd = document.createElement("td");
        titleTd.textContent = item.title || "";
        tr.appendChild(titleTd);

        const dateTd = document.createElement("td");
        dateTd.textContent = item.date || "";
        tr.appendChild(dateTd);

        const imgTd = document.createElement("td");
        const thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.alt = item.title || "";
        applyThumbImage(thumb, item.image_url || "");
        imgTd.appendChild(thumb);
        tr.appendChild(imgTd);

        const statusTd = document.createElement("td");
        statusTd.textContent = item.status === "published" ? "已發布" : "草稿";
        tr.appendChild(statusTd);

        const linkTd = document.createElement("td");
        if (item.external_url) {
          const link = document.createElement("a");
          link.href = item.external_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = item.external_url;
          linkTd.appendChild(link);
        } else {
          linkTd.textContent = "—";
        }
        tr.appendChild(linkTd);

        const pinTd = document.createElement("td");
        pinTd.textContent =
          item.status === "published"
            ? item.pinned
              ? "置頂"
              : "非置頂"
            : item.pinned
              ? "置頂（草稿）"
              : "—";
        tr.appendChild(pinTd);

        const sortTd = document.createElement("td");
        sortTd.textContent = item.status === "published" ? String(item.sort_order ?? "—") : "—";
        tr.appendChild(sortTd);

        const actionsTd = document.createElement("td");
        if (window.ImmbaAdminReadonly?.isViewer?.()) {
          actionsTd.textContent = "—";
        } else {
          const actions = document.createElement("div");
          actions.className = "actions";
          const editBtn = document.createElement("button");
          editBtn.className = "btn secondary edit-btn";
          editBtn.type = "button";
          editBtn.dataset.id = item.id;
          editBtn.textContent = "編輯";
          const delBtn = document.createElement("button");
          delBtn.className = "btn danger del-btn";
          delBtn.type = "button";
          delBtn.dataset.id = item.id;
          delBtn.textContent = "刪除";
          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          actionsTd.appendChild(actions);
        }
        tr.appendChild(actionsTd);

        tbody.appendChild(tr);
      });

      document.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (window.ImmbaAdminReadonly?.isViewer?.()) return;
          const id = btn.getAttribute("data-id");
          const item = window.NewsStore.listAll().find((n) => n.id === id);
          if (item) fillForm(item);
        });
      });

      document.querySelectorAll(".del-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (window.ImmbaAdminReadonly?.isViewer?.()) return;
          const id = btn.getAttribute("data-id");
          if (!confirm("確定刪除此消息？")) return;
          window.NewsStore.removeItem(id);
          renderTable();
        });
      });

      if (window.ImmbaAdminReadonly) window.ImmbaAdminReadonly.refresh("#news-admin-main");
    }

    document.getElementById("reset-form").addEventListener("click", clearForm);

    inputs.file.addEventListener("change", async () => {
      const [file] = inputs.file.files || [];
      if (!file) return;
      if (!isAllowedImageFile(file)) {
        alert("請上傳 jpg、jpeg、png 或 webp 圖片。");
        inputs.file.value = "";
        return;
      }
      try {
        const id = ensureNewsId();
        inputs.image_name = file.name || "";
        const dataUrl = await processImageFile(file);
        const ref = window.NewsStore.attachImage(id, dataUrl, { silent: true });
        inputs.storedImageRef = ref;
        inputs.pendingImageData = "";
        updatePreview();
        showNotice("圖片已寫入，請按「儲存草稿」或「發布文章」完成發布。");
      } catch (err) {
        alert((err && err.message) || "圖片處理失敗。");
        inputs.file.value = "";
        inputs.pendingImageData = "";
        inputs.storedImageRef = "";
        updatePreview();
      } finally {
        inputs.file.value = "";
      }
    });

    function readPinnedFromForm() {
      const el = inputs.pinnedCheckbox || document.getElementById("news-pinned");
      return Boolean(el && el.checked);
    }

    function buildPayload(status, pinnedOverride) {
      const imageUrl = inputs.pendingImageData || inputs.storedImageRef || "";
      const pinned = typeof pinnedOverride === "boolean" ? pinnedOverride : readPinnedFromForm();
      return {
        id: ensureNewsId(),
        title: inputs.title.value.trim(),
        date: inputs.date.value.trim(),
        content: inputs.content.value.trim(),
        external_url: inputs.external_url.value.trim(),
        image_url: imageUrl,
        image_name: inputs.image_name || "",
        pinned,
        status,
        is_published: status === "published"
      };
    }

    function validateCommon(item, status) {
      if (status === "draft") return true;
      if (!item.title) {
        alert("發布前請填寫消息標題");
        return false;
      }
      if (!item.date) {
        alert("發布前請選擇發布日期");
        return false;
      }
      return true;
    }

    async function saveWithStatus(status) {
      try {
        if (window.ImmbaAdminReadonly?.isViewer?.()) {
          showNotice("僅檢視權限，無法儲存或發布。");
          return;
        }
        if (!window.NewsStore || typeof window.NewsStore.saveItem !== "function") {
          showNotice("系統未載入完成，請重新整理後再試一次。");
          return;
        }

        const wantPinned = readPinnedFromForm();
        const item = buildPayload(status, wantPinned);
        if (!validateCommon(item, status)) return;

        const saved = window.NewsStore.saveItem(item);
        inputs.id.value = saved.id || item.id;
        inputs.storedImageRef = saved.image_url || "";
        inputs.pendingImageData = "";
        inputs.file.value = "";
        if (inputs.pinnedCheckbox) inputs.pinnedCheckbox.checked = Boolean(saved.pinned);
        renderTable();
        fillForm(saved);

        if (status === "published" && wantPinned && !saved.pinned) {
          showNotice("置頂儲存失敗，請重新整理頁面後再試一次。");
          return;
        }

        const pinHint = saved.pinned
          ? status === "published"
            ? `（已置頂，排序 ${saved.sort_order || 1}）`
            : "（已勾選置頂，發布後生效）"
          : "";
        const imageHint = saved.image_url ? "" : "（尚未儲存圖片）";
        showNotice(
          status === "published"
            ? `已發布，前台公告已同步${pinHint}${imageHint}`
            : `草稿已儲存，可稍後從列表繼續編輯；前台不會顯示${pinHint}${imageHint}`
        );
      } catch (err) {
        console.error("[admin/news] saveWithStatus error:", err);
        showNotice(`儲存失敗：${err?.message || "未知錯誤"}`);
      }
    }

    document.getElementById("save-draft-btn")?.addEventListener("click", () => {
      saveWithStatus("draft");
    });

    document.getElementById("publish-btn")?.addEventListener("click", () => {
      saveWithStatus("published");
    });

    updatePreview();
    setStatusLabel("draft");
    (async () => {
      const ok = await AdminRequireAuth.ensureSession();
      if (!ok) return;
      document.getElementById("news-admin-root").classList.remove("shell-hide");
      if (window.ImmbaAdminReadonly) window.ImmbaAdminReadonly.applyIfViewer("#news-admin-main");
      assignNewNewsId();
      renderTable();
      window.addEventListener("immba-news-updated", renderTable);
      window.addEventListener("storage", (e) => {
        const key = window.NewsStore?.STORAGE_KEY;
        const imagesKey = window.NewsStore?.IMAGES_KEY;
        if (e.key === key || e.key === imagesKey) renderTable();
      });
    })();
  </script>
</body>
</html>
