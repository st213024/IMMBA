<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>活動集錦管理｜imMBA 後台</title>
  <link rel="stylesheet" href="../admin-shell.css" />
  <style>
    :root {
      --line: #c9d0dc;
      --text: #1a2332;
      --muted: #5a6575;
      --primary-deep: #24303d;
      --primary: #4a5f72;
      --panel: #ffffff;
      --danger: #b65e5e;
      --surface: #f0f4fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    body { margin: 0; background: #e8ebf0; color: var(--text); }
    .admin-main__inner { max-width: 1080px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(15, 52, 96, 0.12);
      padding: 18px;
      margin-bottom: 14px;
    }
    h1 { font-size: 26px; color: var(--primary-deep); margin-bottom: 10px; }
    h2 { font-size: 20px; color: #0f3460; margin-bottom: 10px; }
    .hint { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    label { font-size: 14px; color: #3d4f63; }
    input[type="text"], input[type="password"], input[type="number"], textarea, select {
      border: 1px solid #b8c4d6;
      border-radius: 10px;
      padding: 10px;
      background: #fafbfe;
      color: var(--text);
    }
    textarea { min-height: 140px; resize: vertical; }
    input[type="date"] {
      border: 1px solid #b8c4d6;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fafbfe;
      color: var(--text);
      font-size: 15px;
      min-height: 44px;
      max-width: min(100%, 320px);
    }
    .inline { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, var(--primary-deep), var(--primary));
      color: #fff;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn.secondary { background: var(--surface); color: #243652; border: 1px solid var(--line); }
    .btn.danger { background: var(--danger); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border-top: 1px solid #dde3ec; padding: 10px 6px; text-align: left; vertical-align: top; font-size: 14px; }
    th { color: #3d5266; font-weight: 700; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .thumb {
      width: 88px;
      height: 62px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .hide { display: none; }
    .shell-hide { display: none !important; }
    .top-actions { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .notice {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #e8f2fc;
      color: #0f3460;
      font-size: 14px;
      border: 1px solid #b8d4f0;
    }
    button[disabled]{opacity:.65;cursor:not-allowed;}
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--surface);
      color: #0f3460;
    }
    .status-badge.is-published {
      background: #e8f8ef;
      color: #1e5c3a;
      border-color: #b8e0c8;
    }
    .status-badge.is-draft {
      background: #fff8e6;
      color: #7a5a1a;
      border-color: #f0d896;
    }
    .bilingual-edit {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-items: start;
      margin-top: 14px;
    }
    .lang-panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px 16px;
      background: #fafcfe;
      min-width: 0;
    }
    .lang-panel--zh {
      border-left: 4px solid #4a6fa5;
    }
    .lang-panel h3 {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary-deep);
      margin: 0 0 12px;
      letter-spacing: 0.04em;
    }
    .lang-panel .field:last-child {
      margin-bottom: 0;
    }
    .lang-panel--en {
      border-left: 4px solid #3d6b58;
    }
    .lang-panel--en .field:last-of-type {
      margin-bottom: 0;
    }
    .field-full {
      margin-bottom: 10px;
    }
    .field-full:last-of-type {
      margin-bottom: 0;
    }
    @media (max-width: 860px) {
      .row { grid-template-columns: 1fr; }
      table { font-size: 13px; }
      .bilingual-edit { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-admin-page="activities">
  <div class="admin-app shell-hide" id="activities-admin-root">
    <aside class="admin-sidebar" id="admin-sidebar-mount"></aside>
    <div class="admin-main">
      <div class="admin-main__inner">
  <main id="activities-admin-main">
    <section class="card" id="admin-card">
      <div class="top-actions">
        <div>
          <h1>活動集錦管理</h1>
          <p class="hint" style="margin:6px 0 0;">編輯活動花絮；資料儲存於 ActivityStore，並與前台活動列表同步。</p>
        </div>
        <div class="actions">
          <button class="btn secondary" id="reset-form-btn" type="button">清除表單</button>
          <button class="btn secondary" id="reset-bundled-btn" type="button">還原內建活動集錦</button>
        </div>
      </div>

      <section style="margin-bottom:14px;">
        <h2>新增 / 編輯活動</h2>
        <input id="activity-idx" type="hidden" />
        <input id="activity-sort" type="hidden" value="1" />
        <p class="inline" style="margin-bottom:12px; align-items:center; gap:10px;">
          <span class="hint" style="margin:0;">發布狀態</span>
          <span class="status-badge is-draft" id="activity-status-badge">新活動（尚未儲存）</span>
        </p>

        <div class="field-full field">
          <label for="activity-date">日期（月曆選擇）</label>
          <input id="activity-date" type="date" lang="zh-Hant" autocomplete="off" />
          <p class="hint" style="margin-top:6px; margin-bottom:0;">點選欄位會開啟瀏覽器月曆。儲存時會轉成前台慣用的 YYYY/MM/DD 顯示格式。</p>
        </div>

        <div class="bilingual-edit" aria-label="中英文編輯區">
          <div class="lang-panel lang-panel--zh">
            <h3>中文</h3>
            <p class="hint" style="margin:-4px 0 10px; font-size:13px;">輸入中文後，右側英文約 0.6 秒後會自動翻譯填入（需網路）；可直接改英文覆寫。</p>
            <div class="field">
              <label for="activity-title-zh">活動名稱</label>
              <input id="activity-title-zh" type="text" placeholder="" autocomplete="off" />
            </div>
            <div class="field">
              <label for="activity-paragraphs-zh">文章內容（空行分段）</label>
              <textarea id="activity-paragraphs-zh" placeholder="" autocomplete="off"></textarea>
            </div>
          </div>
          <div class="lang-panel lang-panel--en">
            <h3>English</h3>
            <div class="field">
              <label for="activity-title-en">Title</label>
              <input id="activity-title-en" type="text" placeholder="" />
            </div>
            <div class="field">
              <label for="activity-paragraphs-en">Body（blank line = paragraph）</label>
              <textarea id="activity-paragraphs-en" placeholder=""></textarea>
            </div>
          </div>
        </div>

        <div class="field-full field" style="margin-top:14px; margin-bottom:0;">
          <label for="activity-image">上傳/更換封面圖片（共用）</label>
          <input id="activity-image" type="text" placeholder="" />
          <div class="inline" style="margin-top:10px;">
            <img id="activity-image-preview" class="thumb" src="" alt="封面預覽" />
          </div>
          <div class="field" style="margin-top:10px; margin-bottom:0;">
            <label for="activity-image-file" class="hint">圖片上傳（僅用於預覽；保存只使用 imageUrl）</label>
            <input id="activity-image-file" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
          </div>
        </div>

        <div class="actions" style="margin-top:8px; flex-wrap:wrap;">
          <button class="btn secondary" id="save-draft-btn" type="button">儲存草稿</button>
          <button class="btn" id="publish-btn" type="button">發布文章</button>
          <button class="btn secondary" id="new-btn" type="button">新增新活動（清空）</button>
        </div>
        <p class="hint" style="margin-top:10px; line-height:1.6;">
          儲存草稿：內容會寫入列表（顯示為草稿），下次登入可繼續編輯，<strong>不會</strong>顯示在前台。<br />
          發布文章：需填寫日期與中文活動名稱，儲存後與前台活動集錦同步顯示。
        </p>
        <div id="form-notice" class="notice hide"></div>
      </section>

      <section>
        <h2>活動列表</h2>
        <table>
          <thead>
            <tr>
              <th>狀態</th>
              <th>日期</th>
              <th>中文活動名稱</th>
              <th>英文活動名稱</th>
              <th>圖片</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="activity-tbody"></tbody>
        </table>
      </section>
    </section>
  </main>
      </div>
    </div>
  </div>

  <script src="../../activity-pages.js"></script>
  <script src="../../activity-store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-auth.js"></script>
  <script src="../require-auth.js"></script>
  <script src="../admin-sidebar.js"></script>
  <script src="../admin-readonly.js"></script>
  <script>
    const tbody = document.getElementById("activity-tbody");
    const noticeEl = document.getElementById("form-notice");

    function setStatusBadge(status) {
      const el = document.getElementById("activity-status-badge");
      if (!el) return;
      el.classList.remove("is-published", "is-draft");
      if (status === null || status === undefined) {
        el.textContent = "新活動（尚未儲存）";
        el.classList.add("is-draft");
        return;
      }
      if (status === "published") {
        el.textContent = "已發布";
        el.classList.add("is-published");
      } else {
        el.textContent = "草稿";
        el.classList.add("is-draft");
      }
    }

    function dateStrToInputValue(s) {
      const t = String(s ?? "").trim();
      if (!t) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
      const m = t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
      if (m) {
        const y = m[1];
        const mo = m[2].padStart(2, "0");
        const d = m[3].padStart(2, "0");
        return `${y}-${mo}-${d}`;
      }
      return "";
    }

    function inputValueToStoredDate(val) {
      const t = String(val ?? "").trim();
      if (!t) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t.replace(/-/g, "/");
      return t;
    }

    const inputs = {
      idx: document.getElementById("activity-idx"),
      sort_order: document.getElementById("activity-sort"),
      date: document.getElementById("activity-date"),
      imageSrc: document.getElementById("activity-image"),
      imageFile: document.getElementById("activity-image-file"),
      title: document.getElementById("activity-title-zh"),
      titleEn: document.getElementById("activity-title-en"),
      paragraphs: document.getElementById("activity-paragraphs-zh"),
      paragraphsEn: document.getElementById("activity-paragraphs-en")
    };

    function showNotice(text) {
      noticeEl.textContent = text;
      noticeEl.classList.remove("hide");
      setTimeout(() => noticeEl.classList.add("hide"), 2400);
    }

    function clearForm() {
      inputs.idx.value = "";
      inputs.sort_order.value = "1";
      inputs.date.value = "";
      inputs.imageSrc.value = "";
      if (document.getElementById("activity-image-preview")) {
        document.getElementById("activity-image-preview").src = "";
      }
      inputs.title.value = "";
      inputs.titleEn.value = "";
      inputs.paragraphs.value = "";
      inputs.paragraphsEn.value = "";
      if (inputs.imageFile) inputs.imageFile.value = "";
      setStatusBadge(null);
      showNotice("已清除表單");
    }

    inputs.imageFile?.addEventListener("change", () => {
      const file = inputs.imageFile?.files?.[0];
      if (!file) return;
      const preview = document.getElementById("activity-image-preview");
      if (preview) preview.src = URL.createObjectURL(file);
      showNotice("已載入圖片預覽；請記得在 imageUrl 欄位填入可公開存取的圖片 URL。");
    });

    function computeNextIdx() {
      const list = window.ActivityStore?.listAll?.() || [];
      let max = -1;
      list.forEach((x) => {
        const n = Number(x.idx);
        if (Number.isFinite(n) && n > max) max = n;
      });
      return max + 1;
    }

    async function translateZhToEn(text) {
      const q = String(text ?? "").trim();
      if (!q) return "";
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=${encodeURIComponent(q)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Translation request failed");
      const data = await res.json();
      const parts = data?.[0] || [];
      return parts.map((p) => (Array.isArray(p) ? p[0] : "")).join("");
    }

    async function translateParagraphBlocksToEn(zhText, opts) {
      const silent = opts && opts.silent === true;
      const raw = String(zhText ?? "").trim();
      if (!raw) return "";
      const blocks = raw
        .split(/\n\s*\n+/)
        .map((x) => x.trim())
        .filter(Boolean);
      const chunks = blocks.length ? blocks : [raw];
      const out = [];
      const pause = silent ? 80 : 120;
      for (let i = 0; i < chunks.length; i++) {
        if (!silent) showNotice(`翻譯中文正文：第 ${i + 1} / ${chunks.length} 段…`);
        const en = await translateZhToEn(chunks[i]);
        out.push((en || "").trim());
        if (i < chunks.length - 1) await new Promise((r) => setTimeout(r, pause));
      }
      return out.join("\n\n");
    }

    let autoTranslateSeq = 0;
    let autoTranslateTimer = null;
    const imeActive = { title: false, body: false };

    function scheduleAutoTranslateFromZh() {
      clearTimeout(autoTranslateTimer);
      autoTranslateTimer = setTimeout(runAutoTranslateFromZh, 650);
    }

    async function runAutoTranslateFromZh() {
      if (imeActive.title || imeActive.body) return;
      const seq = ++autoTranslateSeq;
      const zhTitle = (inputs.title?.value || "").trim();
      const zhBody = inputs.paragraphs?.value || "";

      try {
        if (zhTitle) {
          const en = await translateZhToEn(zhTitle);
          if (seq !== autoTranslateSeq) return;
          inputs.titleEn.value = (en || "").trim();
        } else {
          if (seq !== autoTranslateSeq) return;
          inputs.titleEn.value = "";
        }

        if (zhBody.trim()) {
          const enBody = await translateParagraphBlocksToEn(zhBody, { silent: true });
          if (seq !== autoTranslateSeq) return;
          inputs.paragraphsEn.value = enBody;
        } else {
          if (seq !== autoTranslateSeq) return;
          inputs.paragraphsEn.value = "";
        }
      } catch (err) {
        if (seq !== autoTranslateSeq) return;
        console.warn("[auto-translate]", err);
      }
    }

    inputs.title?.addEventListener("compositionstart", () => {
      imeActive.title = true;
    });
    inputs.title?.addEventListener("compositionend", () => {
      imeActive.title = false;
      scheduleAutoTranslateFromZh();
    });
    inputs.title?.addEventListener("input", () => scheduleAutoTranslateFromZh());

    inputs.paragraphs?.addEventListener("compositionstart", () => {
      imeActive.body = true;
    });
    inputs.paragraphs?.addEventListener("compositionend", () => {
      imeActive.body = false;
      scheduleAutoTranslateFromZh();
    });
    inputs.paragraphs?.addEventListener("input", () => scheduleAutoTranslateFromZh());

    function fillForm(item) {
      inputs.idx.value = String(item.idx ?? "");
      inputs.sort_order.value = String(item.sort_order ?? 1);
      inputs.date.value = dateStrToInputValue(item.date ?? "");
      inputs.imageSrc.value = String(item.imageUrl ?? item.imageSrc ?? "");
      inputs.title.value = String(item.titleZh ?? item.title ?? "");
      inputs.titleEn.value = String(item.titleEn ?? "");
      inputs.paragraphs.value = Array.isArray(item.contentZh) ? item.contentZh.join("\n\n") : Array.isArray(item.paragraphs) ? item.paragraphs.join("\n\n") : "";
      inputs.paragraphsEn.value = Array.isArray(item.contentEn) ? item.contentEn.join("\n\n") : Array.isArray(item.paragraphsEn) ? item.paragraphsEn.join("\n\n") : "";
      if (document.getElementById("activity-image-preview")) {
        document.getElementById("activity-image-preview").src = inputs.imageSrc.value || "";
      }
      setStatusBadge(item.status === "published" ? "published" : "draft");
      showNotice("已載入選取活動");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderTable() {
      const items = window.ActivityStore?.listAll?.() || [];
      const fallbackImg = "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=300&q=70";
      tbody.innerHTML = items.map((item) => {
        const titleZh = item.titleZh || item.title || "(無標題)";
        const titleEn = item.titleEn || item.titleZh || item.title || "(No title)";
        const stLabel = item.status === "published" ? "已發布" : "草稿";
        return `
          <tr>
            <td>${stLabel}</td>
            <td>${item.date || "—"}</td>
            <td>${titleZh}</td>
            <td>${titleEn}</td>
            <td><img class="thumb" src="${item.imageUrl || item.imageSrc || fallbackImg}" alt="${titleZh}"></td>
            <td>
              <div class="actions">
                <button class="btn secondary edit-btn" data-idx="${item.idx}" type="button">編輯</button>
                <button class="btn danger del-btn" data-idx="${item.idx}" type="button">刪除</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      document.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-idx"));
          const item = (window.ActivityStore.listAll() || []).find((x) => Number(x.idx) === idx);
          if (item) fillForm(item);
        });
      });

      document.querySelectorAll(".del-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-idx"));
          if (!confirm("確定刪除此活動？刪除後前台會立刻同步更新。")) return;
          window.ActivityStore.removeItemByIdx(idx);
          renderTable();
          clearForm();
        });
      });
    }

    function buildPayloadFromForm(status) {
      const idxRaw = String(inputs.idx.value ?? "").trim();
      let idx;
      if (!idxRaw) {
        idx = computeNextIdx();
      } else {
        const parsed = Number(idxRaw);
        idx = Number.isFinite(parsed) ? parsed : computeNextIdx();
      }
      const st = status === "published" ? "published" : "draft";
      return {
        idx,
        sort_order: Number(inputs.sort_order.value ?? 1),
        date: inputValueToStoredDate(inputs.date.value),
        status: st,
        imageUrl: String(inputs.imageSrc.value ?? "").trim(),
        titleZh: String(inputs.title.value ?? "").trim(),
        titleEn: String(inputs.titleEn.value ?? "").trim(),
        contentZh: String(inputs.paragraphs.value ?? ""),
        contentEn: String(inputs.paragraphsEn.value ?? "")
      };
    }

    function validatePublish(payload) {
      if (!payload.date) {
        alert("發布前請選擇日期。");
        return false;
      }
      if (!payload.titleZh) {
        alert("發布前請填寫中文活動名稱。");
        return false;
      }
      return true;
    }

    document.getElementById("reset-form-btn").addEventListener("click", clearForm);
    document.getElementById("new-btn").addEventListener("click", clearForm);

    document.getElementById("reset-bundled-btn").addEventListener("click", () => {
      if (
        !confirm(
          "將清除此瀏覽器內已儲存的自訂活動，恢復為程式內建的輔大活動集錦（與網站原始列表一致）。您在後台新增或修改過的項目會一併清除。確定嗎？"
        )
      ) {
        return;
      }
      window.ActivityStore.resetToBundledActivities();
      renderTable();
      clearForm();
      showNotice("已還原為內建活動集錦；請重新整理首頁／活動集錦頁確認。");
    });

    document.getElementById("save-draft-btn").addEventListener("click", () => {
      try {
        const payload = buildPayloadFromForm("draft");
        window.ActivityStore.saveItem(payload);
        renderTable();
        const saved = window.ActivityStore.listAll().find((x) => Number(x.idx) === Number(payload.idx));
        if (saved) fillForm(saved);
        showNotice("草稿已儲存。下次登入可從下方列表點「編輯」繼續；前台不會顯示。");
      } catch (err) {
        console.error(err);
        showNotice(err?.message || "儲存失敗");
      }
    });

    document.getElementById("publish-btn").addEventListener("click", () => {
      try {
        const payload = buildPayloadFromForm("published");
        if (!validatePublish(payload)) return;
        window.ActivityStore.saveItem(payload);
        renderTable();
        const saved = window.ActivityStore.listAll().find((x) => Number(x.idx) === Number(payload.idx));
        if (saved) fillForm(saved);
        showNotice("已發布，前台活動集錦已同步。");
      } catch (err) {
        console.error(err);
        showNotice(err?.message || "發布失敗");
      }
    });

    (async () => {
      const ok = await AdminRequireAuth.ensureSession();
      if (!ok) return;
      document.getElementById("activities-admin-root").classList.remove("shell-hide");
      if (window.ImmbaAdminReadonly) window.ImmbaAdminReadonly.applyIfViewer("#activities-admin-main");
      renderTable();
    })();
  </script>
</body>
</html>
